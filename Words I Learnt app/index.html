<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://db.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocab Tracker</title>
    
    <!-- Base44 Database & Auth Mocks (Required for the app to run) -->
    <script>
      globalThis.__B44_DB__ = { auth:{ isAuthenticated: async()=>false, me: async()=>null }, entities:new Proxy({}, { get:()=>({ filter:async()=>[], get:async()=>null, create:async()=>({}), update:async()=>({}), delete:async()=>({}) }) }), integrations:{ Core:{ UploadFile:async()=>({ file_url:'' }) } } };
      const db = globalThis.__B44_DB__;
      
      // Fixes the getAccessToken crash
      window.getAccessToken = async () => null;
    </script>

    <!-- Link to your PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Register the Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/serviceWorker.js')
            .then(reg => console.log('Service Worker registered!'))
            .catch(err => console.log('Service Worker failed.', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
